<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Roma</title>
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicons/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="images/favicons/images/favicon.ico">
    <link rel="manifest" href="site.webmanifest">
    <link
      rel="preload"
      as="image"
      href="images/1.jpg"
      imagesrcset="images/1-460.jpg 460w, images/1-576.jpg 576w, images/1.jpg 921w"
      imagesizes="(max-width: 676px) calc(100vw - 100px), 576px"
      fetchpriority="high"
    >
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
  </head>
  <body>
      <div style="text-align: center;"> 
          <div style="display: inline-block; width: min(576px, calc(100vw - 100px)); margin: 10px 50px;">
            <img
              src="images/1.jpg"
              srcset="images/1-460.jpg 460w, images/1-576.jpg 576w, images/1.jpg 921w"
              sizes="(max-width: 676px) calc(100vw - 100px), 576px"
              alt="Закат над морем"
              width="921"
              height="1152"
              loading="eager"
              fetchpriority="high"
              decoding="async"
              onload="this.style.outline = 'none'"
              style="display: block; width: 100%; height: auto; aspect-ratio: 921 / 1152; outline: 1px solid #000;"
            />
            <div style="display: flex; justify-content: space-between; width: 100%; margin-top: 8px; font-family: Arial, Helvetica, sans-serif; font-size: 120%;">
                <span style="font-weight: 800;">Roma Lozhkin</span>
                <span style="font-weight: 800;">2022</span>
            </div>
          </div>
      </div>
  </body>
</html>
